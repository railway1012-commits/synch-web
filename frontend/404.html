<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0084FF">
  <meta name="description" content="Page not found - SYNCH">
  <title>404 - Page Not Found · SYNCH</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css?v=71">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-primary, #090d16);
      color: var(--text-primary, #f8fafc);
      font-family: var(--font-inter, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background lighting */
    body::before {
      content: '';
      position: fixed;
      top: 25%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 132, 255, 0.16) 0%, rgba(56, 189, 248, 0.04) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top navigation bar */
    .error-header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .error-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .error-logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill, 9999px);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #f87171;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Main Container */
    .error-main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .error-card {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 404 Illustration & Numbers */
    .error-illustration {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .error-code {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(135deg, #f8fafc 20%, #38bdf8 70%, #0084ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(0, 132, 255, 0.4);
    }

    .error-icon-ring {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.3);
      animation: rotateRing 20s linear infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .error-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .error-desc {
      font-size: 0.975rem;
      color: var(--text-secondary, #94a3b8);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Actions */
    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 24px;
      background: linear-gradient(135deg, #0084ff 0%, #0066cc 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-pill, 9999px);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 132, 255, 0.35);
      transition: all 0.2s ease;
    }

    .btn-action-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(0, 132, 255, 0.48);
    }

    .btn-action-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary, #f8fafc);
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-pill, 9999px);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .error-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.85rem;
    }

    .error-footer a {
      color: var(--text-muted, #64748b);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .error-footer a:hover {
      color: var(--accent-light, #38bdf8);
    }

    @media (max-width: 640px) {
      .error-header {
        padding: 14px 20px;
      }
      .error-card {
        padding: 36px 22px;
      }
      .error-code {
        font-size: 4.25rem;
      }
      .error-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="error-header">
    <a href="/" class="error-brand">
      <span class="error-logo">SYNCH</span>
    </a>
    <span class="error-badge">404 Error</span>
  </header>

  <!-- Main -->
  <main class="error-main">
    <div class="error-card">
      <div class="error-illustration">
        <div class="error-icon-ring"></div>
        <div class="error-code">404</div>
      </div>

      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">
        The page, conversation, or link you are looking for doesn't exist, has been removed, or was typed incorrectly.
      </p>

      <div class="error-actions">
        <a href="/chat" id="btnPrimary" class="btn-action-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="btnPrimaryText">Open Chats</span>
        </a>

        <button onclick="handleGoBack()" class="btn-action-secondary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back
        </button>

        <a href="/" class="btn-action-secondary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Return to Home
        </a>
      </div>

      <div class="error-footer">
        <a href="/login">Sign In</a>
        <span>·</span>
        <a href="/signup">Create Account</a>
        <span>·</span>
        <a href="/settings">Settings</a>
      </div>
    </div>
  </main>

  <script>
    // Smart user detection for primary CTA
    (function () {
      const token = sessionStorage.getItem('synch_token') || localStorage.getItem('synch_token');
      const btn = document.getElementById('btnPrimary');
      const btnText = document.getElementById('btnPrimaryText');

      if (!token) {
        if (btn) btn.href = '/login';
        if (btnText) btnText.textContent = 'Sign In to SYNCH';
      } else {
        if (btn) btn.href = '/chat';
        if (btnText) btnText.textContent = 'Go to Chats';
      }
    })();

    function handleGoBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
