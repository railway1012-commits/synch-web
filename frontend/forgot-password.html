<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · SYNCH</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><h1>SYNCH</h1></div>
      <div id="fpStep"></div>
    </div>
  </div>
  <div class="auth-loading-overlay" id="authLoadingOverlay">
    <div class="auth-spinner"></div>
    <p id="authLoadingText">Loading...</p>
  </div>
  <script src="js/auth.js"></script>
  <script>
    const stepEl = document.getElementById('fpStep');
    const overlay = document.getElementById('authLoadingOverlay');
    const overlayText = document.getElementById('authLoadingText');
    const params = new URLSearchParams(window.location.search);
    let email = params.get('email') || '';

    function showLoading(t) { overlayText.textContent = t || 'Loading...'; overlay.classList.add('visible'); }
    function hideLoading() { overlay.classList.remove('visible'); }
    function fieldErr(el, msg) {
      let e = el.parentElement.querySelector('.field-error');
      if (!e) { e = document.createElement('div'); e.className = 'field-error'; el.parentElement.appendChild(e); }
      e.textContent = msg;
    }

    function renderRequest() {
      stepEl.innerHTML = `
        <h2 class="auth-step-title">Reset your password</h2>
        <p class="auth-subtext">Enter your account email and we'll send you a reset code.</p>
        <form id="f" class="auth-form">
          <div class="input-group"><label>Email</label><input type="email" id="email" value="${email}" placeholder="you@example.com"></div>
          <button class="btn btn-primary" type="submit">Send code</button>
        </form>
        <button type="button" class="btn-link" id="back">&larr; Back to sign in</button>
      `;
      document.getElementById('back').addEventListener('click', () => window.location.href = '/login');
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        email = document.getElementById('email').value.trim();
        try {
          showLoading('Sending code...');
          await apiRequest('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
          hideLoading();
          renderCode();
        } catch (err) { hideLoading(); fieldErr(document.getElementById('email'), err.message); }
      });
    }

    function renderCode() {
      stepEl.innerHTML = `
        <button type="button" class="btn-back" id="backBtn">&larr; Back</button>
        <h2 class="auth-step-title" style="margin-top: 12px;">Enter the code</h2>
        <p class="auth-subtext">We sent a 6-digit code to <strong>${email}</strong>.</p>
        <form id="f" class="auth-form">
          <div class="input-group">
            <label>Code</label>
            <input type="text" id="code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" style="font-size: 20px; letter-spacing: 4px; text-align: center;">
          </div>
          <button class="btn btn-primary" type="submit">Verify</button>
        </form>
        <div id="resendStatusMsg" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 12px; text-align: center;"></div>
        <div style="text-align: center; margin-top: 16px;">
          <button type="button" class="btn-link" id="resendBtn" style="background: none; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer;">
            Didn't receive a code? <span style="color: var(--accent); font-weight: 600;">Resend</span>
          </button>
        </div>
      `;

      const resendBtn = document.getElementById('resendBtn');
      let cooldownTimer = null;

      function startResendCooldown(seconds = 60) {
        if (!resendBtn) return;
        resendBtn.style.pointerEvents = 'none';
        resendBtn.style.opacity = '0.5';
        let remaining = seconds;
        resendBtn.innerHTML = `Resend available in <span style="color: var(--accent); font-weight: 600;">${remaining}s</span>`;
        
        if (cooldownTimer) clearInterval(cooldownTimer);
        cooldownTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(cooldownTimer);
            resendBtn.style.pointerEvents = 'auto';
            resendBtn.style.opacity = '1';
            resendBtn.innerHTML = `Didn't receive a code? <span style="color: var(--accent); font-weight: 600;">Resend</span>`;
          } else {
            resendBtn.innerHTML = `Resend available in <span style="color: var(--accent); font-weight: 600;">${remaining}s</span>`;
          }
        }, 1000);
      }

      startResendCooldown(60);

      document.getElementById('backBtn').addEventListener('click', () => {
        if (cooldownTimer) clearInterval(cooldownTimer);
        renderRequest();
      });

      resendBtn.addEventListener('click', async () => {
        const msgEl = document.getElementById('resendStatusMsg');
        try {
          showLoading('Resending code...');
          await apiRequest('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
          hideLoading();
          if (msgEl) {
            msgEl.style.display = 'block';
            msgEl.style.background = 'rgba(16, 185, 129, 0.12)';
            msgEl.style.color = 'var(--success, #10b981)';
            msgEl.textContent = 'Verification code resent successfully!';
          }
          startResendCooldown(60);
        } catch (err) {
          hideLoading();
          if (msgEl) {
            msgEl.style.display = 'block';
            msgEl.style.background = 'rgba(239, 68, 68, 0.12)';
            msgEl.style.color = 'var(--danger)';
            msgEl.textContent = err.message || 'Failed to resend code';
          }
        }
      });

      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const codeInput = document.getElementById('code');
        const code = codeInput.value.trim();
        if (!code || code.length !== 6) return fieldErr(codeInput, 'Enter a valid 6-digit code');
        try {
          showLoading('Verifying...');
          await apiRequest('/api/auth/verify-reset-code', { method: 'POST', body: JSON.stringify({ email, code }) });
          hideLoading();
          renderNewPassword(code);
        } catch (err) { hideLoading(); fieldErr(codeInput, err.message); }
      });
    }

    function renderNewPassword() {
      stepEl.innerHTML = `
        <h2 class="auth-step-title">Choose a new password</h2>
        <form id="f" class="auth-form">
          <div class="input-group"><label>New password</label><input type="password" id="pw1" placeholder="At least 6 characters"></div>
          <div class="input-group"><label>Confirm password</label><input type="password" id="pw2" placeholder="Re-enter password"></div>
          <button class="btn btn-primary" type="submit">Reset password</button>
        </form>
      `;
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw1 = document.getElementById('pw1').value;
        const pw2 = document.getElementById('pw2').value;
        if (pw1.length < 6) return fieldErr(document.getElementById('pw1'), 'Must be at least 6 characters');
        if (pw1 !== pw2) return fieldErr(document.getElementById('pw2'), 'Passwords do not match');
        try {
          showLoading('Saving...');
          await apiRequest('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ email, newPassword: pw1 }) });
          hideLoading();
          window.location.href = '/login';
        } catch (err) { hideLoading(); fieldErr(document.getElementById('pw2'), err.message); }
      });
    }

    renderRequest();
  </script>
</body>
</html>
