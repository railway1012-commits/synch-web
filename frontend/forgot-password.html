<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · SYNCH</title>
<link rel="stylesheet" href="css/main.css?v=68">
<link rel="stylesheet" href="css/auth.css?v=68">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><h1>SYNCH</h1></div>
      <div id="fpStep"></div>
    </div>
  </div>
  <div class="auth-loading-overlay" id="authLoadingOverlay">
    <div class="auth-spinner"></div>
    <p id="authLoadingText">Loading...</p>
  </div>
  <script src="js/auth.js?v=68"></script>
  <script>
    const stepEl = document.getElementById('fpStep');
    const overlay = document.getElementById('authLoadingOverlay');
    const overlayText = document.getElementById('authLoadingText');
    const params = new URLSearchParams(window.location.search);
    let email = params.get('email') || '';

    let overlayShowTime = 0;
    let currentErrorTimer = null;

    function showLoading(t) {
      overlayText.textContent = t || 'Loading...';
      overlayShowTime = Date.now();
      overlay.classList.add('visible');
    }

    async function hideLoading() {
      const elapsed = Date.now() - overlayShowTime;
      const remaining = Math.max(0, 1500 - elapsed);
      if (remaining > 0) {
        await new Promise(r => setTimeout(r, remaining));
      }
      overlay.classList.remove('visible');
    }

    function dismissErrorPopup() {
      const container = document.getElementById('authErrorPopupContainer');
      if (!container) return;
      const popups = container.querySelectorAll('.auth-error-popup');
      popups.forEach(p => {
        if (!p.classList.contains('closing')) {
          p.classList.add('closing');
          setTimeout(() => { if (p.parentNode) p.remove(); }, 220);
        }
      });
      if (currentErrorTimer) {
        clearTimeout(currentErrorTimer);
        currentErrorTimer = null;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showErrorPopup(msg, inputEl = null) {
      if (!msg) return;

      if (inputEl) {
        inputEl.classList.remove('has-error');
        void inputEl.offsetWidth;
        inputEl.classList.add('has-error');
        try { inputEl.focus(); } catch (e) {}

        const onInput = () => {
          inputEl.classList.remove('has-error');
          dismissErrorPopup();
          inputEl.removeEventListener('input', onInput);
        };
        inputEl.addEventListener('input', onInput);
      }

      let container = document.getElementById('authErrorPopupContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'authErrorPopupContainer';
        container.className = 'auth-error-popup-container';
        document.body.appendChild(container);
      }

      if (currentErrorTimer) {
        clearTimeout(currentErrorTimer);
        currentErrorTimer = null;
      }

      container.innerHTML = `
        <div class="auth-error-popup" role="alert">
          <div class="auth-error-popup-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div class="auth-error-popup-msg">${escapeHtml(msg)}</div>
          <button type="button" class="auth-error-popup-close" aria-label="Close">&times;</button>
        </div>
      `;

      const popup = container.querySelector('.auth-error-popup');
      const closeBtn = container.querySelector('.auth-error-popup-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dismissErrorPopup();
        });
      }
      if (popup) {
        popup.addEventListener('click', () => {
          dismissErrorPopup();
        });
      }
      currentErrorTimer = setTimeout(dismissErrorPopup, 4500);
    }

    function fieldErr(el, msg) {
      showErrorPopup(msg, el);
    }

    function renderRequest() {
      dismissErrorPopup();
      stepEl.innerHTML = `
        <h2 class="auth-step-title">Reset your password</h2>
        <p class="auth-subtext">Enter your account email and we'll send you a reset code.</p>
        <form id="f" class="auth-form">
          <div class="input-group"><label>Email</label><input type="email" id="email" value="${email}" placeholder="you@example.com"></div>
          <button class="btn btn-primary" type="submit">Send code</button>
        </form>
        <button type="button" class="btn-link" id="back">&larr; Back to sign in</button>
      `;
      document.getElementById('back').addEventListener('click', () => window.location.href = '/login');
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        email = document.getElementById('email').value.trim();
        if (!email) return fieldErr(document.getElementById('email'), 'Enter your account email');
        try {
          showLoading('Sending code...');
          await apiRequest('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
          await hideLoading();
          renderCode();
        } catch (err) {
          await hideLoading();
          fieldErr(document.getElementById('email'), err.message);
        }
      });
    }

    function renderCode() {
      dismissErrorPopup();
      stepEl.innerHTML = `
        <button type="button" class="btn-back" id="backBtn">&larr; Back</button>
        <h2 class="auth-step-title" style="margin-top: 12px;">Enter the code</h2>
        <p class="auth-subtext">We sent a 6-digit code to <strong>${email}</strong>.</p>
        <form id="f" class="auth-form">
          <div class="input-group">
            <label>Code</label>
            <input type="text" id="code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" style="font-size: 20px; letter-spacing: 4px; text-align: center;">
          </div>
          <button class="btn btn-primary" type="submit">Verify</button>
        </form>
        <div id="resendStatusMsg" style="display: none; padding: 12px 20px; border-radius: var(--radius-pill); font-size: 13px; margin-top: 14px; text-align: center; font-weight: 500;"></div>
        <div style="text-align: center; margin-top: 16px;">
          <button type="button" class="btn-link" id="resendBtn" style="background: none; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer;">
            Didn't receive a code? <span style="color: var(--accent); font-weight: 600;">Resend</span>
          </button>
        </div>
      `;

      const resendBtn = document.getElementById('resendBtn');
      let cooldownTimer = null;

      function startResendCooldown(seconds = 60) {
        if (!resendBtn) return;
        resendBtn.style.pointerEvents = 'none';
        resendBtn.style.opacity = '0.5';
        let remaining = seconds;
        resendBtn.innerHTML = `Resend available in <span style="color: var(--accent); font-weight: 600;">${remaining}s</span>`;
        
        if (cooldownTimer) clearInterval(cooldownTimer);
        cooldownTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(cooldownTimer);
            resendBtn.style.pointerEvents = 'auto';
            resendBtn.style.opacity = '1';
            resendBtn.innerHTML = `Didn't receive a code? <span style="color: var(--accent); font-weight: 600;">Resend</span>`;
          } else {
            resendBtn.innerHTML = `Resend available in <span style="color: var(--accent); font-weight: 600;">${remaining}s</span>`;
          }
        }, 1000);
      }

      startResendCooldown(60);

      document.getElementById('backBtn').addEventListener('click', () => {
        if (cooldownTimer) clearInterval(cooldownTimer);
        renderRequest();
      });

      resendBtn.addEventListener('click', async () => {
        const msgEl = document.getElementById('resendStatusMsg');
        try {
          showLoading('Resending code...');
          await apiRequest('/api/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
          await hideLoading();
          if (msgEl) {
            msgEl.style.display = 'block';
            msgEl.style.background = 'rgba(16, 185, 129, 0.12)';
            msgEl.style.color = 'var(--success, #10b981)';
            msgEl.textContent = 'Verification code resent successfully!';
          }
          startResendCooldown(60);
        } catch (err) {
          await hideLoading();
          showErrorPopup(err.message || 'Failed to resend code');
          if (msgEl) msgEl.style.display = 'none';
        }
      });

      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const codeInput = document.getElementById('code');
        const code = codeInput.value.trim();
        if (!code || code.length !== 6) return fieldErr(codeInput, 'Enter a valid 6-digit code');
        try {
          showLoading('Verifying...');
          await apiRequest('/api/auth/verify-reset-code', { method: 'POST', body: JSON.stringify({ email, code }) });
          await hideLoading();
          renderNewPassword(code);
        } catch (err) {
          await hideLoading();
          fieldErr(codeInput, err.message);
        }
      });
    }

    function renderNewPassword() {
      dismissErrorPopup();
      stepEl.innerHTML = `
        <h2 class="auth-step-title">Choose a new password</h2>
        <form id="f" class="auth-form">
          <div class="input-group"><label>New password</label><input type="password" id="pw1" placeholder="At least 6 characters"></div>
          <div class="input-group"><label>Confirm password</label><input type="password" id="pw2" placeholder="Re-enter password"></div>
          <button class="btn btn-primary" type="submit">Reset password</button>
        </form>
      `;
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw1 = document.getElementById('pw1').value;
        const pw2 = document.getElementById('pw2').value;
        if (pw1.length < 6) return fieldErr(document.getElementById('pw1'), 'Must be at least 6 characters');
        if (pw1 !== pw2) return fieldErr(document.getElementById('pw2'), 'Passwords do not match');
        try {
          showLoading('Saving...');
          await apiRequest('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ email, newPassword: pw1 }) });
          await hideLoading();
          window.location.href = '/login';
        } catch (err) {
          await hideLoading();
          fieldErr(document.getElementById('pw2'), err.message);
        }
      });
    }

    renderRequest();
  </script>
</body>
</html>
