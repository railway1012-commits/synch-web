<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function() {
    try {
      var t = sessionStorage.getItem('synch_token') || localStorage.getItem('synch_token');
      if (t) {
        window.location.replace('/chat');
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNCH - Sign In / Create Account</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/main.css?v=71">
<link rel="stylesheet" href="css/auth.css?v=71">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card" id="authCard">
      <div class="auth-logo">
        <h1>SYNCH</h1>
        <p class="auth-tagline">Fast, private messaging for you and your people</p>
      </div>

      <!-- All step content is injected here by auth-flow.js -->
      <div id="authStep"></div>
    </div>
  </div>

  <div class="auth-loading-overlay" id="authLoadingOverlay">
    <div class="auth-spinner"></div>
    <p id="authLoadingText">Loading...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/socket.js?v=71"></script>
  <script src="js/auth.js?v=71"></script>
  <script src="js/custom-dropdown.js?v=71"></script>
  <script src="js/google-identity.js?v=71"></script>
  <script src="js/auth-flow.js?v=71"></script>
</body>
</html>
